<!DOCTYPE html>
<html>
    <script src="https://kit.fontawesome.com/b761556490.js" crossorigin="anonymous"></script>
    <head>
        <!-- This is the initalisation of the website and the title of the page -->
        <title>ReVibration Studios Cart</title>
        <link rel="stylesheet" type="text/css" href="stylesheet.css">
        <script src="main.js" async></script>
    </head>

    <body>

        <!-- Banner -->
        <div>
            <img class="banner" src="Images/Web Banner.png">
        </div>

        <!-- Navigation Menu -->
        <ul class="topnav">
            <li><a href="Home.html">Home</a></li>
            <li><a href="AboutUs.html">About Us</a></li>
            <li><a href="Products.html">Products</a></li>
            <li><a href="Support.html">Support</a></li>
            <a href="Cart.html"><img class="basket" src="Images/shopping-cart.png"></a>
        </ul>
        
        <canvas class="animatedCanvas" id="animatedCanvas"></canvas>

        <!-- This is the checkout form-->
        <div class="contactForm">
            <!-- This sets the visialble title for the section-->
            <h1>Checkout</h1>
            <form>

                <!-- This is where the user can enter their name -->
                <label for="fname">Name</label>
                <input type="text" id="name" name="name" placeholder = "Your full name.." required autocomplete="name">

                <!-- This is where the user can enter their email -->
                <label for="email">Email</label>
                <input id="email" name="email" placeholder="Your email.." required autocomplete="email" type="email">

                <!-- This is where the user can enter which town they live in -->
                <label for="town">Town</label>
                <input type="text" id="town" name="town" placeholder="Your town.." required autocomplete="address-line2">

                <!-- This is where the user can enter their address -->
                <label for="address">Address</label>
                <input type="text" id="address" name="address" placeholder="Your address.." required autocomplete="address-line1">

                <!-- This is where the user can enter their postcode -->
                <label for="postcode">Postcode</label>
                <input type="text" id="postcode" name="postcode" placeholder="Your postcode.." required autocomplete="postal-code">

                <!-- These are some options that the user can pick to sort the enquiries as the come in-->
                <label for="country">Country</label>
                <select id="country" name = "country" required>
                    <option value="UK">UK</option>
                    <option value="USA">USA</option>
                    <option value="Poland">Poland</option>
                </select>

                <!-- This is where the user can enter their email -->
                <label for="paypalEmail">PayPal Email</label>
                <input id="paypalEmail" name="email" placeholder="Your PayPal email.." required type="email">
                
                <!-- This is where they can submit their enquiry to be sent -->
                <input type="submit" value="Purchase">
            </form>
        </div>

        <footer>
            <!-- This is a footer where all of the icons are links to social media -->
                <div class="icons">
                <a href="https://en-gb.facebook.com/"><img class="social-icon" src="Images/Facebook Icon.png"></a>
                <a href="https://www.instagram.com/"><img class="social-icon" src="Images/Instagram icon.png"></a>
                <a href="https://www.youtube.com/"><img class="social-icon" src="Images/YouTube Icon.png"></a>
                <a href="https://twitter.com/?lang=en-gb"><img class="social-icon" src="Images/Twitter Icon.png"></a>
            </div>

                <div class="settings">
                    <!-- This is the section where the background customisation occurs -->
                    <h3>Background Colour Customisation</h3>
                    <select class = "selector" id = "backgroundChange">
                        <option value="#B3936F">Light Brown</option>
                        <option value="red">Red</option>
                        <option value="black">Black</option>
                        <option value="blue">Blue</option>
                    </select>
    
                    <!-- These are the setting for the font size-->
                    <h3>Font Size Customisation</h3>
                    <select class="selector" id = "fontChange">
                        <option value="16px">16 (default) </option>
                        <option value="8px">8</option>
                        <option value="10px">10</option>
                        <option value="12px">12</option>
                        <option value="14px">14</option>
                        <option value="18px">18</option>
                        <option value="24px">24</option>
                        <option value="30px">30</option>
                        <option value="36px">36</option>
                        <option value="48px">48</option>
                    </select>
                </div>
    
            </footer>
    </body>
</html>

<!DOCTYPE html>
<html>
    <script src="https://kit.fontawesome.com/b761556490.js" crossorigin="anonymous"></script>
    <head>
        <!-- This is the initalisation of the website and the title of the page -->
        <title>ReVibration Studios Cart</title>
        <link rel="stylesheet" type="text/css" href="stylesheet.css">
        <script src="shop.js" async></script>
        <script src="main.js" async></script>
    </head>

    <body>

        <!-- Banner -->
        <div>
            <img class="banner" src="Images/Web Banner.png">
        </div>

        <!-- Navigation Menu -->
        <ul class="topnav">
            <li><a href="Home.html">Home</a></li>
            <li><a href="AboutUs.html">About Us</a></li>
            <li><a href="Products.html">Products</a></li>
            <li><a href="Support.html">Support</a></li>
            <a href="Cart.html"><img class="basket" src="Images/shopping-cart.png"></a>
        </ul>
        <canvas class="animatedCanvas" id="animatedCanvas"></canvas>
        <!-- These are all of the items for sale on my wbesite-->
        <div class="shop-items">
            <div class="shop-item">

                <!-- This is the section for no man's sky and each other product follows the same design-->
                <!-- This is the title of the game -->
                <span class="shop-item-title">No Man's Sky</span>
                <!-- This is the cover art of the game-->
                <img class="shop-item-image" src="./Images/No Man's Sky Cover Art.jpg">
                <!-- The details contain the price and the add to cart button-->
                <div class="shop-item-details">
                    <!-- This is the price -->
                    <span class="shop-item-price">£19.99</span>
                    <!-- Add to cart -->
                    <button class="btn btn-primary shop-item-button" type="button">ADD TO CART</button>
                </div>
            </div>

            <!-- This is the minecraft section -->
            <div class="shop-item">
                <span class="shop-item-title">Minecraft</span>
                <img class="shop-item-image" src="./Images/Minecraft cover art.jpg">
                <div class="shop-item-details">
                    <span class="shop-item-price">£17.99</span>
                    <button class="btn btn-primary shop-item-button"type="button">ADD TO CART</button>
                </div>
            </div>
            
            <!-- This is the forza horizon 4 section -->
            <div class="shop-item">
                <span class="shop-item-title">Forza Horizon 4</span>
                <img class="shop-item-image" src="./Images/518449-forza-horizon-4-windows-apps-front-cover.jpg">
                <div class="shop-item-details">
                    <span class="shop-item-price">£49.99</span>
                    <button class="btn btn-primary shop-item-button" type="button">ADD TO CART</button>
                </div>
            </div>

            <!-- This is the overwatch section -->
            <div class="shop-item">
                <span class="shop-item-title">Overwatch</span>
                <img class="shop-item-image" src="./Images/405165-overwatch-game-of-the-year-edition-playstation-4-front-cover.jpg">
                <div class="shop-item-details">
                    <span class="shop-item-price">£19.99</span>
                    <button class="btn btn-primary shop-item-button" type="button">ADD TO CART</button>
                </div>
            </div>

            <!-- This is the watch dogs section -->
            <div class="shop-item">
                <span class="shop-item-title">Watch_Dogs: Legion</span>
                <img class="shop-item-image" src="./Images/Watch Dogs Legion Cover Art.jpg">
                <div class="shop-item-details">
                    <span class="shop-item-price">£39.99</span>
                    <button class="btn btn-primary shop-item-button" type="button">ADD TO CART</button>
                </div>
            </div>

            <!-- This is the grounded section -->
            <div class="shop-item">
                <span class="shop-item-title">Grounded</span>
                <img class="shop-item-image" src="./Images/Grounded Cover Art.jpg">
                <div class="shop-item-details">
                    <span class="shop-item-price">£12.99</span>
                    <button class="btn btn-primary shop-item-button" type="button">ADD TO CART</button>
                </div>
            </div>
        </div>
    </section>

        <!-- This is the cart section that gets updated-->
        <h1>Cart</h1>
            <div class="c-cart">
                <!-- This establishes the headers for the cart-->
            <div class="cart-row">
                <h2 class="cart-item cart-header cart-column">Item</h2>
                <h2 class="cart-price cart-header cart-column">Price</h2>
                <h2 class="cart-quantity cart-header cart-column">Quantity</h2>
            </div>
            <!-- These are the cart items-->
            <div class="cart-items">
            </div>
            <!-- This is the cart total section -->
            <div class="cart-total">
                <!-- This shows the total tag above the actual total-->
                <strong class="cart-total-title">Total</strong>
                <!-- This is total cart price -->
                <span class="cart-total-price">£0</span>
            </div>

            <!-- This is the purchase button -->
            <button class="btn btn-primary btn-purchase" type="button">PURCHASE</button>

            <!-- This is the html for the currency converter -->
            <strong class = "cart-total-title">Currency Converter</strong>
            <select class = "currencyConverter">
                <option value=1>GBP</option>
                <option value=1.38>USD</option>
                <option value=5.25>PLN</option>
                <option value=149.98>JPY</option>
                <option value=1.15>EUR</option>
            </select>
            </div>


        </section>

        <footer>
            <!-- This is a footer where all of the icons are links to social media -->
                <div class="icons">
                <a href="https://en-gb.facebook.com/"><img class="social-icon" src="Images/Facebook Icon.png"></a>
                <a href="https://www.instagram.com/"><img class="social-icon" src="Images/Instagram icon.png"></a>
                <a href="https://www.youtube.com/"><img class="social-icon" src="Images/YouTube Icon.png"></a>
                <a href="https://twitter.com/?lang=en-gb"><img class="social-icon" src="Images/Twitter Icon.png"></a>
            </div>

                <div class="settings">
                    <!-- This is the section where the background customisation occurs -->
                    <h3>Background Colour Customisation</h3>
                    <select class = "selector" id = "backgroundChange">
                        <option value="#B3936F">Light Brown</option>
                        <option value="red">Red</option>
                        <option value="black">Black</option>
                        <option value="blue">Blue</option>
                    </select>
    
                    <!-- These are the setting for the font size-->
                    <h3>Font Size Customisation</h3>
                    <select class="selector" id = "fontChange">
                        <option value="16px">16 (default) </option>
                        <option value="8px">8</option>
                        <option value="10px">10</option>
                        <option value="12px">12</option>
                        <option value="14px">14</option>
                        <option value="18px">18</option>
                        <option value="24px">24</option>
                        <option value="30px">30</option>
                        <option value="36px">36</option>
                        <option value="48px">48</option>
                    </select>
                </div>
    
            </footer>
    </body>
</html>
